<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="60" fill="#4f46e5"/>
  <circle cx="60" cy="60" r="54" fill="#4338ca" stroke="#818cf8" stroke-width="2"/>
  
  <!-- Robot Head & AI Dots (MinnaLearn / Elements of AI mascot) -->
  <g transform="translate(60,50)">
    <rect x="-18" y="-12" width="36" height="28" rx="8" fill="#e0e7ff"/>
    <!-- Eyes -->
    <circle cx="-7" cy="2" r="3.5" fill="#312e81"/>
    <circle cx="7" cy="2" r="3.5" fill="#312e81"/>
    <!-- Antenna -->
    <line x1="0" y1="-12" x2="0" y2="-20" stroke="#e0e7ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-22" r="4" fill="#a5b4fc"/>
    <!-- Body curve -->
    <path d="M-22,26 C-22,16 22,16 22,26 Z" fill="#c7d2fe"/>
  </g>
  
  <!-- Text banner -->
  <rect x="15" y="86" width="90" height="20" rx="10" fill="#1e1b4b"/>
  <text x="60" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#c7d2fe" text-anchor="middle" letter-spacing="0.4">ELEMENTS OF AI</text>
</svg>
